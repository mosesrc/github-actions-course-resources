name: Env Variables Deployment
on:
  push:
    branches:
      - env-variables
defaults:
  run:
    working-directory: ./Env-Variables-Starting-Project
env:
  MONGO_DB_NAME: environment-var
jobs:
  test:
    env:
      MONGODB_CLUSTER_ADDRESS: localhost:27017
      MONGODB_USERNAME: mongoadmin
      MONGODB_PASSWORD: secret
      PORT: 8080
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:XYZ
      - name: Run tests
        run: npm test
      - name: Output information
        run: echo "..."
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |
          echo "..."
